name: Verify launchpad
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nanxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/nanxi_test
      - run: npx playwright install --with-deps chromium
      - run: node test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchpad-previews
          path: docs/*.png
          retention-days: 7
