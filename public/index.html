<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#285448"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>我的起点 · 南西</title></head><body>
<div id="auth" hidden><div class="auth-brand">我的起点<span>南西的个人启动台</span></div><form id="authForm" class="auth-panel"><span class="eyebrow">私人空间</span><h1 id="authTitle">打开你的书桌</h1><p id="authHint">在 Mac 和 iPhone 上登录同一账户，接着做手边的事</p><label>邮箱<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><label id="setupKey" hidden>初始化密钥<input name="key" type="password" autocomplete="off"><small>首次使用：由部署管理员提供初始化密钥</small></label><p id="authError" role="alert"></p><button class="primary" type="submit">登录</button></form></div>
<div id="app" hidden>
<aside id="sidebar"><div class="brand"><span class="brand-mark">起</span><div>我的起点<small>南西的个人启动台</small></div><button id="closeNav" class="icon mobile" aria-label="收起目录">×</button></div><nav><button class="nav-item active" data-view="desk"><span>▤</span>我的书桌</button><button class="nav-item" data-view="cards"><span>▢</span>知识卡片</button><button class="nav-item" data-view="todos"><span>✓</span>待办事项</button><div class="nav-label">收藏分类<button id="addCategory" class="icon" aria-label="添加分类">＋</button></div><div id="categoryNav"></div></nav><div class="sidebar-bottom"><button id="settings" class="nav-item"><span>⚙</span>设置</button><div class="profile"><span id="avatar">南</span><div><b id="profileName">南西</b><small>私人书桌</small></div><button id="logout" class="icon" aria-label="退出登录">↪</button></div></div></aside>
<div id="shade" hidden></div><main><header><div class="breadcrumb"><button id="openNav" class="icon mobile" aria-label="打开目录">☰</button><span>我的起点</span><span class="slash">/</span><span id="currentView">我的书桌</span></div><button id="sync" class="sync">正在连接</button></header>
<div class="content"><section class="intro"><div><p id="date" class="eyebrow"></p><h1 id="pageTitle">给今天，一个好起点<span class="title-dot">。</span></h1><p id="pageSubtitle">常用的网站，手边的灵感，接下来要做的事</p></div><div id="clock" class="clock"></div></section>
<section id="searchSection"><form id="searchForm"><div class="engine-tabs" id="engineTabs"></div><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" aria-label="搜索内容" placeholder="想找点什么？" autocomplete="off"><kbd>⌘ K</kbd><button class="primary" type="submit">搜索 <span>↗</span></button></div></form></section>
<section id="bookmarksSection"><div class="section-heading"><div><h2 id="bookmarkTitle">收藏夹</h2><span id="bookmarkCount"></span></div><button id="addBookmark" class="quiet">＋ 添加网站</button></div><div class="filterline"><div id="bookmarkTabs" class="tabs"></div><input id="bookmarkFilter" type="search" placeholder="查找收藏" aria-label="查找收藏"></div><div id="bookmarks" class="bookmark-grid"></div></section>
<section id="cardsSection"><div class="section-heading"><div><h2 id="cardTitle">手边的卡片</h2><span id="cardCount"></span></div><button id="addCard" class="quiet">＋ 写一张</button></div><div class="card-toolbar"><div id="cardTabs" class="tabs"><button data-filter="all" class="active">全部</button><button data-filter="note">知识笔记</button><button data-filter="todo">待办</button><button data-filter="done">已完成</button></div><input id="cardFilter" type="search" placeholder="查找卡片" aria-label="查找卡片"></div><div id="cards" class="cards-grid"></div></section>
<footer><span>留一点空间，给新的想法</span><button id="homepageHelp">设为起始页 ↗</button></footer></div></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status" hidden></div><script src="/app.js" type="module"></script></body></html>
