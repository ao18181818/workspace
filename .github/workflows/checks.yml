name: Verify launchpad
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nanxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/nanxi_test
      - name: Validate Aliyun container deployment
        env:
          APP_DOMAIN: start.example.com
          POSTGRES_PASSWORD: ci-only-container-password
          SETUP_KEY: ci-only-container-setup-key
        run: |
          docker compose config --quiet
          docker compose build app
          trap 'docker compose down' EXIT
          docker compose up -d db app --wait
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/status').then(async r=>{const s=await r.json();if(!r.ok||s.authenticated||s.initialized)process.exit(1)}).catch(()=>process.exit(1))"
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
      - run: npx playwright install --with-deps chromium
      - run: node test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchpad-previews
          path: docs/*.png
          retention-days: 7
